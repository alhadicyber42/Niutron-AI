<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niutron VRM Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa30;
            font-size: 18px;
            text-align: center;
            z-index: 10;
            display: none;
        }
        
        .loading-spinner {
            border: 4px solid rgba(255, 170, 48, 0.2);
            border-top: 4px solid #ffaa30;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            z-index: 5;
        }
    </style>
    <!-- Load Three.js r149 (last stable with global exports) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Load Three-VRM (compatible with Three r149) -->
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.0/lib/three-vrm.js"></script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="vrm-canvas"></canvas>
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>Loading VRM Avatar...</div>
        </div>
        <div id="status">Initializing...</div>
    </div>

    <script>
        console.log('[VRM] Starting initialization...');
        console.log('[VRM] THREE available:', typeof THREE !== 'undefined');
        console.log('[VRM] THREE.GLTFLoader available:', typeof THREE.GLTFLoader !== 'undefined');
        console.log('[VRM] THREE.OrbitControls available:', typeof THREE.OrbitControls !== 'undefined');
        console.log('[VRM] THREE.VRM available:', typeof THREE.VRM !== 'undefined');

        // Scene setup
        let scene, camera, renderer, controls;
        let vrm = null;
        let mixer = null;
        let clock = new THREE.Clock();
        let currentAnimation = null;
        let isBlinking = false;
        let isSpeaking = false;
        let lipSyncLevel = 0;

        // Expressions
        const expressions = {
            neutral: 0,
            happy: 0,
            sad: 0,
            angry: 0,
            surprised: 0,
            relaxed: 0
        };

        function init() {
            try {
                console.log('[VRM] Initializing scene...');
                const canvas = document.getElementById('vrm-canvas');
                const container = document.getElementById('canvas-container');

                // Scene
                scene = new THREE.Scene();
                scene.background = null;
                console.log('[VRM] Scene created');

                // Camera
                camera = new THREE.PerspectiveCamera(
                    35,
                    container.clientWidth / container.clientHeight,
                    0.1,
                    1000
                );
                camera.position.set(0, 1.3, 2.5);
                console.log('[VRM] Camera created');

                // Renderer
                renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas, 
                    alpha: true,
                    antialias: true 
                });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.shadowMap.enabled = true;
                console.log('[VRM] Renderer created');

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(1, 2, 3);
                directionalLight.castShadow = true;
                scene.add(directionalLight);

                const rimLight = new THREE.DirectionalLight(0xffaa30, 0.3);
                rimLight.position.set(-1, 1, -2);
                scene.add(rimLight);
                console.log('[VRM] Lights added');

                // Controls
                controls = new THREE.OrbitControls(camera, canvas);
                controls.target.set(0, 1.3, 0);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 1.0;
                controls.maxDistance = 10.0;
                controls.update();
                console.log('[VRM] Controls created');

                // Resize handler
                window.addEventListener('resize', onWindowResize);

                // Start animation loop
                animate();
                console.log('[VRM] Animation loop started');
                
                document.getElementById('status').textContent = 'Ready';
            } catch (error) {
                console.error('[VRM] Initialization error:', error);
                document.getElementById('status').textContent = 'Initialization failed';
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        async function loadVRM(url) {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            
            loading.style.display = 'block';
            status.textContent = 'Loading VRM...';
            console.log('[VRM] Loading VRM from:', url);

            try {
                // Create loader
                const loader = new THREE.GLTFLoader();
                
                // Register VRM plugin (v1.0.0 syntax)
                loader.register((parser) => {
                    return new THREE.VRM.VRMLoaderPlugin(parser);
                });
                console.log('[VRM] Loader created with VRM plugin');

                // Load the VRM
                const gltf = await loader.loadAsync(url);
                console.log('[VRM] GLTF loaded:', gltf);
                
                // Remove previous VRM if exists
                if (vrm) {
                    scene.remove(vrm.scene);
                    THREE.VRM.VRMUtils.deepDispose(vrm.scene);
                }

                // Get VRM from userData
                vrm = gltf.userData.vrm;
                console.log('[VRM] VRM extracted:', vrm);
                
                // Rotate model to face camera
                vrm.scene.rotation.y = Math.PI;
                
                // Add to scene
                scene.add(vrm.scene);
                console.log('[VRM] VRM added to scene');

                // Setup animation mixer
                mixer = new THREE.AnimationMixer(vrm.scene);

                // Setup expressions
                if (vrm.expressionManager) {
                    console.log('[VRM] Available expressions:', Object.keys(vrm.expressionManager._expressionMap));
                }

                loading.style.display = 'none';
                status.textContent = 'VRM Loaded ✓';
                console.log('[VRM] Loading complete!');
                
                return true;
            } catch (error) {
                console.error('[VRM] Error loading VRM:', error);
                loading.style.display = 'none';
                status.textContent = 'Error loading VRM: ' + error.message;
                return false;
            }
        }

        function setExpression(expressionName, value) {
            if (!vrm || !vrm.expressionManager) return;
            
            try {
                vrm.expressionManager.setValue(expressionName, value);
                expressions[expressionName] = value;
            } catch (error) {
                console.warn('[VRM] Expression not found:', expressionName);
            }
        }

        function updateBlink() {
            if (!vrm || !vrm.expressionManager) return;
            
            if (!isBlinking) {
                isBlinking = true;
                setExpression('blink', 1.0);
                
                setTimeout(() => {
                    setExpression('blink', 0.0);
                    isBlinking = false;
                }, 100);
            }
        }

        function updateLipSync(level) {
            if (!vrm || !vrm.expressionManager) return;
            
            lipSyncLevel = level;
            const vowels = ['aa', 'ih', 'ou', 'ee'];
            const randomVowel = vowels[Math.floor(Math.random() * vowels.length)];
            
            if (level > 0) {
                setExpression(randomVowel, level);
            } else {
                vowels.forEach(v => setExpression(v, 0));
            }
        }

        function setMood(mood, intensity = 1.0) {
            if (!vrm || !vrm.expressionManager) return;
            
            // Reset all expressions
            Object.keys(expressions).forEach(exp => {
                setExpression(exp, 0);
            });
            
            // Set mood
            setExpression(mood, intensity);
        }

        function lookAt(x, y, z) {
            if (!vrm || !vrm.lookAt) return;
            
            vrm.lookAt.target.set(x, y, z);
        }

        function playAnimation(animationName) {
            if (!vrm || !mixer) return;
            
            console.log('[VRM] Play animation:', animationName);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update controls
            if (controls) {
                controls.update();
            }

            // Update VRM
            if (vrm) {
                vrm.update(delta);
                
                // Auto-blink
                if (Math.random() < 0.001) {
                    updateBlink();
                }
            }

            // Update mixer
            if (mixer) {
                mixer.update(delta);
            }

            // Render
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // API for Python to call
        window.vrmAPI = {
            loadVRM: loadVRM,
            setExpression: setExpression,
            setMood: setMood,
            updateLipSync: updateLipSync,
            lookAt: lookAt,
            playAnimation: playAnimation,
            getStatus: () => vrm ? 'loaded' : 'empty'
        };
        
        console.log('[VRM] vrmAPI registered on window');

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Hide loading spinner initially
        document.getElementById('loading').style.display = 'none';
        document.getElementById('status').textContent = 'Initializing...';

        console.log('[VRM] Niutron VRM Viewer script loaded');
</body>
</html>
