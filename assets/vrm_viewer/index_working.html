<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Niutron VRM Avatar</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa30;
            font-size: 16px;
            text-align: center;
            display: none;
        }
        .spinner {
            border: 3px solid rgba(255,170,48,0.3);
            border-top: 3px solid #ffaa30;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Memuat VRM...</div>
    </div>
    <div id="info">Initializing...</div>
    <canvas id="canvas"></canvas>
    
    <!-- Import maps for ES modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.1.5/lib/three-vrm.module.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        
        console.log('[VRM] === Niutron VRM Viewer with VRMA Animations ===');
        console.log('[VRM] THREE version:', THREE.REVISION);
        
        let scene, camera, renderer, controls, clock;
        let currentVRM = null;
        let mixer = null;
        let elapsed = 0;
        
        const canvas = document.getElementById('canvas');
        const info = document.getElementById('info');
        const loading = document.getElementById('loading');
        
        // ============================================
        // VRMA ANIMATION SYSTEM
        // ============================================
        let idleAnimations = [];
        let talkingAnimations = [];
        let currentIdleAction = null;
        let currentTalkingAction = null;
        let isTalking = false;
        let idleLoopCount = 0;
        let idleLoopsBeforeSwitch = 3;
        
        // Load VRMA file
        async function loadVRMA(url, vrm) {
            try {
                const loader = new GLTFLoader();
                loader.register((parser) => new VRMLoaderPlugin(parser));
                
                const gltf = await loader.loadAsync(url);
                
                if (gltf.animations && gltf.animations.length > 0) {
                    const clip = gltf.animations[0];
                    
                    // Retarget animation to current VRM
                    if (vrm && vrm.humanoid) {
                        const retargetedClip = VRMUtils.retargetClip(vrm, clip);
                        return retargetedClip;
                    }
                    return clip;
                }
                return null;
            } catch (error) {
                console.warn('[VRMA] Failed to load:', url, error);
                return null;
            }
        }
        
        // Load all idle animations
        async function loadIdleAnimations() {
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const animPath = baseUrl.replace('/vrm_viewer', '/vrm_animations/idle animation');
            
            const idleFiles = [
                'Neutral idle/Neutral Idle.vrma',
                'idle 1/Idle.vrma',
                'idle 2/Idle 2.vrma',
                'idle 3/idle 3.vrma',
                'idle 4/Idle 4.vrma',
                'idle 5/Idle 5.vrma',
                'idle 6/idle 6.vrma',
                'standing idle/Standing Idle.vrma',
                'happy idle/Happy Idle.vrma',
                'happy idle 2/Happy Idle 2.vrma',
                'sad idle/Sad Idle 1.vrma',
                'sad idle 2/Sad Idle 2.vrma',
                'Defeat Idle 1/Defeat Idle.vrma',
                'Defeat idle 2/Defeat Idle 2.vrma',
                'victory idle/Victory Idle.vrma',
                'idle transition/Idle Transition.vrma',
                'gerah/gerah.vrma',
                'meregangkan tangan/meregangkan tangan.vrma',
                'Idle melihat kuku/idle melihat kuku.vrma'
            ];
            
            console.log('[VRMA] Loading idle animations...');
            const clips = [];
            
            for (const file of idleFiles) {
                const url = `${animPath}/${file}`;
                const clip = await loadVRMA(url, currentVRM);
                if (clip) {
                    clips.push(clip);
                    console.log('[VRMA] Loaded idle:', file);
                }
            }
            
            idleAnimations = clips;
            console.log(`[VRMA] Total idle animations loaded: ${clips.length}`);
            
            // Start first idle animation
            if (clips.length > 0) {
                playRandomIdleAnimation();
            }
        }
        
        // Load talking animations from SELESAI folder
        async function loadTalkingAnimations() {
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const animPath = baseUrl.replace('/vrm_viewer', '/vrm_animations/idle animation/SELESAI');
            
            const talkingFiles = [
                'Talking (1).vrma',
                'Talking (3).vrma',
                'Talking (7).vrma',
                'Agreeing (1).vrma',
                'Agreeing.vrma',
                'Standing Arguing (1).vrma',
                'Standing Arguing.vrma',
                'Acknowledging.vrma',
                'Hand Raising.vrma',
                'Hands Forward Gesture.vrma',
                'Happy Hand Gesture.vrma',
                'Pointing.vrma',
                'Pointing Forward.vrma',
                'Shrugging.vrma',
                'Head Gesture.vrma',
                'Standing Greeting.vrma',
                'Thankful.vrma'
            ];
            
            // Also load from SELESAI 2
            const talkingFiles2 = [
                'Talking.vrma',
                'Talking (2).vrma',
                'Talking (4).vrma',
                'Talking (5).vrma',
                'Talking (6).vrma',
                'Talking (8).vrma',
                'Talking (9).vrma'
            ];
            
            console.log('[VRMA] Loading talking animations...');
            const clips = [];
            
            // Load from SELESAI folder
            for (const file of talkingFiles) {
                const url = `${animPath}/${file}`;
                const clip = await loadVRMA(url, currentVRM);
                if (clip) {
                    clips.push(clip);
                    console.log('[VRMA] Loaded talking:', file);
                }
            }
            
            // Load from SELESAI 2 folder
            const animPath2 = baseUrl.replace('/vrm_viewer', '/vrm_animations/idle animation/SELESAI 2');
            for (const file of talkingFiles2) {
                const url = `${animPath2}/${file}`;
                const clip = await loadVRMA(url, currentVRM);
                if (clip) {
                    clips.push(clip);
                    console.log('[VRMA] Loaded talking:', file);
                }
            }
            
            talkingAnimations = clips;
            console.log(`[VRMA] Total talking animations loaded: ${clips.length}`);
        }
        
        // Play random idle animation
        function playRandomIdleAnimation() {
            if (!mixer || idleAnimations.length === 0 || isTalking) return;
            
            // Stop current idle
            if (currentIdleAction) {
                currentIdleAction.fadeOut(0.5);
            }
            
            // Pick random idle
            const randomIndex = Math.floor(Math.random() * idleAnimations.length);
            const clip = idleAnimations[randomIndex];
            
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopRepeat, Infinity);
            action.clampWhenFinished = true;
            action.fadeIn(0.5);
            action.play();
            
            currentIdleAction = action;
            idleLoopCount = 0;
            idleLoopsBeforeSwitch = 3 + Math.floor(Math.random() * 4); // 3-6 loops
            
            console.log('[VRMA] Playing idle animation:', clip.name);
        }
        
        // Play random talking animation
        function playNextTalkingAnimation() {
            if (!mixer || talkingAnimations.length === 0 || !isTalking) return;
            
            // Stop current talking
            if (currentTalkingAction) {
                currentTalkingAction.stop();
            }
            
            // Fade out idle while talking
            if (currentIdleAction) {
                currentIdleAction.fadeOut(0.3);
            }
            
            // Pick random talking animation
            const randomIndex = Math.floor(Math.random() * talkingAnimations.length);
            const clip = talkingAnimations[randomIndex];
            
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.fadeIn(0.3);
            action.play();
            
            currentTalkingAction = action;
            
            console.log('[VRMA] Playing talking animation:', clip.name);
        }
        
        // Start talking mode
        function startTalking() {
            isTalking = true;
            isSpeakingBlink = true;
            
            if (talkingAnimations.length > 0) {
                playNextTalkingAnimation();
            }
            
            console.log('[VRMA] Started talking mode');
        }
        
        // Stop talking mode
        function stopTalking() {
            isTalking = false;
            isSpeakingBlink = false;
            
            if (currentTalkingAction) {
                currentTalkingAction.fadeOut(0.5);
                currentTalkingAction = null;
            }
            
            // Resume idle
            if (idleAnimations.length > 0) {
                setTimeout(() => {
                    if (!isTalking) {
                        playRandomIdleAnimation();
                    }
                }, 500);
            }
            
            // Reset mouth
            if (currentVRM) resetMouth(currentVRM);
            
            console.log('[VRMA] Stopped talking mode');
        }
        
        // ============================================
        // AUTO BLINK SYSTEM
        // ============================================
        let blinkPhase = 'idle';
        let blinkPhaseTimer = 0;
        let blinkTimer = 0;
        let nextBlinkIn = scheduleNextBlink(false);
        let blinksRemaining = 0;
        let closeSpeed = 0.10;
        let openSpeed = 0.20;
        let holdTime = 0.06;
        let peakValue = 1.0;
        let isSpeakingBlink = false;
        
        const BLINK_CLOSE_FAST = 0.10;
        const BLINK_CLOSE_SLOW = 0.16;
        const BLINK_HOLD_MIN = 0.06;
        const BLINK_HOLD_MAX = 0.14;
        const BLINK_OPEN_NORMAL = 0.20;
        const BLINK_OPEN_SLOW = 0.28;
        const INTER_BLINK_GAP = 0.18;
        
        function gamma2(min, range) {
            return min + (Math.random() + Math.random()) * 0.5 * range;
        }
        
        function scheduleNextBlink(speaking) {
            if (speaking) return gamma2(5, 7);
            if (Math.random() < 0.05) return gamma2(10, 10);
            return gamma2(2, 6);
        }
        
        function scheduleBurst() {
            const r = Math.random();
            if (r < 0.72) return 1;
            if (r < 0.92) return 2;
            return 3;
        }
        
        function randomizeBlinkParams(isSecondInBurst) {
            peakValue = Math.random() < 0.15 
                ? 0.5 + Math.random() * 0.3 
                : 0.92 + Math.random() * 0.08;
            
            if (isSecondInBurst) {
                closeSpeed = BLINK_CLOSE_FAST * 0.8;
                openSpeed = BLINK_OPEN_NORMAL * 0.85;
                holdTime = BLINK_HOLD_MIN;
            } else {
                const tired = Math.random() < 0.2;
                closeSpeed = tired ? BLINK_CLOSE_SLOW : gamma2(BLINK_CLOSE_FAST, BLINK_CLOSE_SLOW - BLINK_CLOSE_FAST);
                openSpeed = tired ? BLINK_OPEN_SLOW : gamma2(BLINK_OPEN_NORMAL, BLINK_OPEN_SLOW - BLINK_OPEN_NORMAL);
                holdTime = gamma2(BLINK_HOLD_MIN, BLINK_HOLD_MAX - BLINK_HOLD_MIN);
            }
        }
        
        function hasExpression(vrm, name) {
            if (!vrm?.expressionManager) return false;
            return vrm.expressionManager.getExpression(name) !== undefined;
        }
        
        function applyBlinkDirect(vrm, value) {
            const em = vrm.expressionManager;
            if (!em) return;
            
            const names = [];
            if (hasExpression(vrm, 'blinkLeft')) names.push('blinkLeft', 'blinkRight');
            else if (hasExpression(vrm, 'EyeBlinkLeft')) names.push('EyeBlinkLeft', 'EyeBlinkRight');
            else if (hasExpression(vrm, 'blink')) names.push('blink');
            
            for (const name of names) {
                const expr = em.getExpression(name);
                if (!expr) continue;
                const binds = expr._binds || [];
                for (const bind of binds) {
                    if (!bind.primitives || bind.index == null || bind.weight == null) continue;
                    for (const mesh of bind.primitives) {
                        if (mesh.morphTargetInfluences && mesh.morphTargetInfluences[bind.index] != null) {
                            mesh.morphTargetInfluences[bind.index] = bind.weight * value;
                        }
                    }
                }
            }
        }
        
        function updateBlink(delta, vrm) {
            if (!vrm?.expressionManager) return;
            
            if (blinkPhase === 'idle') {
                blinkTimer += delta;
                applyBlinkDirect(vrm, 0);
                if (blinkTimer >= nextBlinkIn) {
                    blinkTimer = 0;
                    blinksRemaining = scheduleBurst();
                    randomizeBlinkParams(false);
                    blinkPhase = 'closing';
                    blinkPhaseTimer = 0;
                }
                return;
            }
            
            blinkPhaseTimer += delta;
            
            if (blinkPhase === 'closing') {
                const t = Math.min(blinkPhaseTimer / closeSpeed, 1);
                applyBlinkDirect(vrm, t * t * peakValue);
                if (t >= 1) { blinkPhase = 'closed'; blinkPhaseTimer = 0; }
            } else if (blinkPhase === 'closed') {
                applyBlinkDirect(vrm, peakValue);
                if (blinkPhaseTimer >= holdTime) {
                    blinkPhase = 'opening';
                    blinkPhaseTimer = 0;
                }
            } else if (blinkPhase === 'opening') {
                const t = Math.min(blinkPhaseTimer / openSpeed, 1);
                const eased = 1 - Math.pow(1 - t, 3);
                applyBlinkDirect(vrm, peakValue * (1 - eased));
                if (t >= 1) {
                    applyBlinkDirect(vrm, 0);
                    blinksRemaining--;
                    if (blinksRemaining > 0) {
                        blinkPhase = 'inter';
                        blinkPhaseTimer = 0;
                        randomizeBlinkParams(true);
                    } else {
                        blinkPhase = 'idle';
                        blinkTimer = 0;
                        nextBlinkIn = scheduleNextBlink(isSpeakingBlink);
                    }
                }
            } else if (blinkPhase === 'inter') {
                applyBlinkDirect(vrm, 0);
                if (blinkPhaseTimer >= INTER_BLINK_GAP) {
                    blinkPhase = 'closing';
                    blinkPhaseTimer = 0;
                }
            }
        }
        
        // ============================================
        // MOOD SYSTEM
        // ============================================
        const MOOD_PRESETS = {
            neutral: { happy: 0.02, relaxed: 0.08 },
            happy: { happy: 0.75, relaxed: 0.65 },
            sad: { sad: 0.70, relaxed: 0.10 },
            excited: { happy: 0.85, relaxed: 0.75, surprised: 0.30 },
            thinking: { relaxed: 0.18 },
            bored: { relaxed: 0.35 },
            curious: { surprised: 0.35, relaxed: 0.08 },
            angry: { angry: 0.70 },
            surprised: { surprised: 0.85 }
        };
        
        const IDLE_MOOD_POOL = [
            { mood: 'neutral', weight: 4 },
            { mood: 'happy', weight: 3 },
            { mood: 'curious', weight: 2 },
            { mood: 'thinking', weight: 1.5 },
            { mood: 'bored', weight: 1 }
        ];
        
        let currentMood = { ...MOOD_PRESETS.neutral };
        let targetMood = { ...MOOD_PRESETS.neutral };
        let activeMoodName = 'neutral';
        let idleMoodTimer = 0;
        let nextIdleMoodIn = 5 + Math.random() * 4;
        let idleEnabled = true;
        
        const MOOD_LERP_SPEED = 1.2;
        
        function pickIdleMood() {
            const total = IDLE_MOOD_POOL.reduce((s, m) => s + m.weight, 0);
            let r = Math.random() * total;
            for (const m of IDLE_MOOD_POOL) {
                if ((r -= m.weight) <= 0) return m.mood;
            }
            return 'neutral';
        }
        
        function setTargetMood(mood) {
            if (mood === activeMoodName) return;
            activeMoodName = mood;
            targetMood = { ...(MOOD_PRESETS[mood] || MOOD_PRESETS.neutral) };
        }
        
        function lerpMood(delta) {
            const t = Math.min(MOOD_LERP_SPEED * delta, 1);
            for (const k in targetMood) {
                if (currentMood[k] === undefined) currentMood[k] = 0;
                currentMood[k] += (targetMood[k] - currentMood[k]) * t;
            }
        }
        
        function applyMood(vrm, noise) {
            const em = vrm.expressionManager;
            if (!em) return;
            
            const setValue = (name, value) => {
                try {
                    em.setValue(name, Math.max(0, Math.min(1, value)));
                } catch (e) {}
                const pascal = name.charAt(0).toUpperCase() + name.slice(1);
                if (pascal !== name) {
                    try {
                        em.setValue(pascal, Math.max(0, Math.min(1, value)));
                    } catch (e) {}
                }
            };
            
            if (currentMood.happy !== undefined) setValue('happy', currentMood.happy + noise);
            if (currentMood.sad !== undefined) setValue('sad', currentMood.sad);
            if (currentMood.relaxed !== undefined) setValue('relaxed', currentMood.relaxed);
            if (currentMood.surprised !== undefined) setValue('surprised', currentMood.surprised);
            if (currentMood.angry !== undefined) setValue('angry', currentMood.angry);
        }
        
        function updateMicroExpressions(delta, vrm) {
            if (!vrm?.expressionManager) return;
            
            if (idleEnabled && !isTalking) {
                idleMoodTimer += delta;
                if (idleMoodTimer >= nextIdleMoodIn) {
                    idleMoodTimer = 0;
                    nextIdleMoodIn = 4 + Math.random() * 4;
                    setTargetMood(pickIdleMood());
                }
            }
            
            const noise = Math.sin(elapsed * 1.8) * 0.008;
            lerpMood(delta);
            applyMood(vrm, noise);
        }
        
        // ============================================
        // LIP SYNC SYSTEM
        // ============================================
        const MOUTH_SHAPES = ['aa', 'ih', 'ou', 'ee', 'oh'];
        let smoothedMouth = 0;
        let currentShape = 0;
        let currentMouthValue = 0;
        let shapeTimer = 0;
        let shapeDuration = 0.14;
        let visemeBlend = 0.3;
        
        const MAX_MOUTH = 0.65;
        const SMOOTH_OPEN = 0.28;
        const SMOOTH_CLOSE = 0.10;
        
        function updateLipSync(audioLevel, vrm, delta) {
            if (!vrm?.expressionManager) return;
            
            const smoothing = audioLevel > smoothedMouth ? SMOOTH_OPEN : SMOOTH_CLOSE;
            smoothedMouth += (audioLevel - smoothedMouth) * smoothing;
            
            const rawValue = Math.min(smoothedMouth * 1.15, 1.0);
            const mouthValue = Math.pow(rawValue, 1.4) * MAX_MOUTH;
            currentMouthValue = mouthValue;
            
            shapeTimer += delta;
            if (shapeTimer >= shapeDuration) {
                shapeTimer = 0;
                shapeDuration = 0.10 + Math.random() * 0.12;
                visemeBlend = 0.20 + Math.random() * 0.35;
                
                const openBias = mouthValue > MAX_MOUTH * 0.5 ? 0.4 : 0;
                const r = Math.random();
                if (r < openBias) {
                    currentShape = 0;
                } else {
                    currentShape = (currentShape + 1) % MOUTH_SHAPES.length;
                }
            }
            
            const blendT = shapeTimer / shapeDuration;
            const smoothBlend = blendT < 0.5 
                ? 2 * blendT * blendT 
                : 1 - Math.pow(-2 * blendT + 2, 2) / 2;
            
            const em = vrm.expressionManager;
            for (const s of MOUTH_SHAPES) {
                try { em.setValue(s, 0); } catch (e) {}
            }
            
            const primary = MOUTH_SHAPES[currentShape];
            const secondary = MOUTH_SHAPES[(currentShape + 1) % MOUTH_SHAPES.length];
            
            try {
                em.setValue(primary, mouthValue * (1 - smoothBlend * visemeBlend));
                em.setValue(secondary, mouthValue * smoothBlend * visemeBlend);
            } catch (e) {}
        }
        
        function resetMouth(vrm) {
            if (!vrm?.expressionManager) return;
            for (const s of MOUTH_SHAPES) {
                try { vrm.expressionManager.setValue(s, 0); } catch (e) {}
            }
        }
        
        // ============================================
        // THREE.JS INITIALIZATION
        // ============================================
        function init() {
            console.log('[VRM] Initializing...');
            
            clock = new THREE.Clock();
            
            scene = new THREE.Scene();
            scene.background = null;
            
            camera = new THREE.PerspectiveCamera(
                30,
                window.innerWidth / window.innerHeight,
                0.1,
                20
            );
            camera.position.set(0, 1.4, 2.5);
            
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true,
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.setClearColor(0x000000, 0);
            
            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            
            const ambient = new THREE.AmbientLight(0xffffff, Math.PI * 0.5);
            scene.add(ambient);
            
            controls = new OrbitControls(camera, canvas);
            controls.screenSpacePanning = true;
            controls.target.set(0, 1.4, 0);
            controls.update();
            
            window.addEventListener('resize', onResize);
            
            animate();
            
            info.textContent = '✓ Ready';
            console.log('[VRM] ✓ Initialization complete');
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            elapsed += delta;
            
            if (controls) controls.update();
            
            if (currentVRM) {
                currentVRM.update(delta);
                updateBlink(delta, currentVRM);
                updateMicroExpressions(delta, currentVRM);
            }
            
            if (mixer) {
                mixer.update(delta);
                
                // Check if talking animation finished, play next
                if (isTalking && currentTalkingAction && !currentTalkingAction.isRunning()) {
                    playNextTalkingAnimation();
                }
                
                // Check idle loop count
                if (!isTalking && currentIdleAction && currentIdleAction.isRunning()) {
                    // Simple loop detection based on time
                    const clipDuration = currentIdleAction.getClip().duration;
                    if (currentIdleAction.time >= clipDuration - 0.1) {
                        idleLoopCount++;
                        if (idleLoopCount >= idleLoopsBeforeSwitch) {
                            playRandomIdleAnimation();
                        }
                    }
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // ============================================
        // VRM LOADING
        // ============================================
        async function loadVRM(url) {
            loading.style.display = 'block';
            info.textContent = 'Loading VRM...';
            console.log('[VRM] Loading from:', url);
            
            try {
                const loader = new GLTFLoader();
                loader.register((parser) => new VRMLoaderPlugin(parser));
                
                console.log('[VRM] Fetching...');
                const gltf = await loader.loadAsync(url);
                console.log('[VRM] ✓ GLTF loaded');
                
                const vrm = gltf.userData.vrm;
                console.log('[VRM] ✓ VRM extracted:', vrm);
                
                if (currentVRM) {
                    scene.remove(currentVRM.scene);
                }
                
                currentVRM = vrm;
                vrm.scene.rotation.y = Math.PI;
                scene.add(vrm.scene);
                
                mixer = new THREE.AnimationMixer(vrm.scene);
                
                // Reset animation state
                blinkPhase = 'idle';
                blinkTimer = 0;
                nextBlinkIn = scheduleNextBlink(false);
                idleMoodTimer = 0;
                nextIdleMoodIn = 5 + Math.random() * 4;
                activeMoodName = 'neutral';
                currentMood = { ...MOOD_PRESETS.neutral };
                targetMood = { ...MOOD_PRESETS.neutral };
                
                loading.style.display = 'none';
                info.textContent = '✓ VRM loaded - Loading animations...';
                console.log('[VRM] ✓✓✓ SUCCESS! VRM displayed');
                
                // Load VRMA animations
                await loadIdleAnimations();
                await loadTalkingAnimations();
                
                info.textContent = `✓ Ready - ${idleAnimations.length} idle, ${talkingAnimations.length} talking animations`;
                
                return true;
            } catch (error) {
                console.error('[VRM] ❌ Load error:', error);
                loading.style.display = 'none';
                info.textContent = '❌ Load failed: ' + error.message;
                return false;
            }
        }
        
        function setExpression(name, value) {
            if (!currentVRM?.expressionManager) return;
            try {
                currentVRM.expressionManager.setValue(name, value);
            } catch (e) {
                console.warn('[VRM] Expression not found:', name);
            }
        }
        
        function setMood(mood, intensity = 1.0) {
            idleEnabled = false;
            setTargetMood(mood);
        }
        
        function enableIdleMood(enabled) {
            idleEnabled = enabled;
            if (enabled) {
                idleMoodTimer = 0;
                nextIdleMoodIn = 2 + Math.random() * 3;
            }
        }
        
        function lookAt(x, y, z) {
            if (!currentVRM?.lookAt) return;
            currentVRM.lookAt.target.set(x, y, z);
        }
        
        function playAnimation(name) {
            console.log('[VRM] Play animation:', name);
        }
        
        function getStatus() {
            return currentVRM ? 'loaded' : 'empty';
        }
        
        // Lip sync control
        let lipSyncActive = false;
        let lipSyncLevel = 0;
        
        function startLipSync() {
            lipSyncActive = true;
            startTalking();
            console.log('[VRM] Lip sync started');
        }
        
        function stopLipSync() {
            lipSyncActive = false;
            lipSyncLevel = 0;
            stopTalking();
            console.log('[VRM] Lip sync stopped');
        }
        
        function updateLipSyncLevel(level) {
            lipSyncLevel = level;
            if (currentVRM && lipSyncActive) {
                updateLipSync(level, currentVRM, clock.getDelta());
            }
        }
        
        // Export API
        window.vrmAPI = {
            loadVRM,
            setExpression,
            setMood,
            enableIdleMood,
            updateLipSync: updateLipSyncLevel,
            startLipSync,
            stopLipSync,
            lookAt,
            playAnimation,
            getStatus
        };
        
        console.log('[VRM] ✓ API exported to window.vrmAPI');
        console.log('[VRM] Available: auto-blink, idle expressions, lip sync, VRMA animations');
        
        // Initialize
        init();
    </script>
</body>
</html>
